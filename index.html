<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur Économies Pompe à Chaleur</title>
    
    <!-- Importation de la police Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pn: {
                            blue: '#5C5EFF',     /* Bleu primaire */
                            navy: '#1E1F4D',     /* Texte sombre */
                            light: '#F4F5FF',    /* Fond actif / carte */
                            border: '#E1E2FF',   /* Bordures douces */
                            gray: '#6B7280',     /* Texte inactif */
                            bg: '#F3F4F6'        /* Fond de la page */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F3F4F6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        /* Personnalisation du Range Slider pour le remplissage dynamique */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            outline: none;
            /* Le background sera géré dynamiquement par JS en linear-gradient */
            background: #E5E7EB; 
        }
        
        /* Curseur du slider (Webkit/Chrome/Safari) */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #5C5EFF;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        
        /* Curseur du slider (Firefox) */
        input[type=range]::-moz-range-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #5C5EFF;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        input[type=range]::-moz-range-thumb:hover {
            transform: scale(1.1);
        }

        /* Enlever la piste par défaut sur Firefox */
        input[type=range]::-moz-range-track {
            background: transparent;
            border: none;
        }

        /* Transitions douces pour les boutons carrés */
        .btn-chauffage {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-[0_16px_40px_rgba(30,31,77,0.06)] overflow-hidden">
        
        <!-- EN-TÊTE BLEU -->
        <div class="bg-pn-blue py-8 px-6 text-center">
            <h2 class="text-white text-2xl md:text-3xl font-extrabold mb-1">Estimez vos économies</h2>
            <p class="text-white/90 text-sm font-semibold uppercase tracking-wider">Avec une pompe à chaleur</p>
        </div>

        <!-- CONTENU -->
        <div class="p-6 md:p-10">
            <!-- Utilisation d'une grille avec des proportions ajustées (5 colonnes à gauche, 7 à droite) -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-12">
                
                <!-- COLONNE GAUCHE (Plus fine pour laisser de l'espace à droite) -->
                <div class="md:col-span-5 flex flex-col space-y-8">
                    
                    <!-- Boutons d'énergie carrés (96x96px) et sans icônes -->
                    <div>
                        <label class="block text-pn-navy font-bold mb-4 text-base md:text-lg">Votre chauffage actuel :</label>
                        <div class="flex gap-4">
                            <!-- Électrique -->
                            <button type="button" data-type="electrique" class="btn-chauffage w-24 h-24 rounded-xl border-2 flex items-center justify-center focus:outline-none bg-pn-blue border-pn-blue text-white shadow-md">
                                <span class="font-semibold text-sm">Électrique</span>
                            </button>
                            
                            <!-- Gaz -->
                            <button type="button" data-type="gaz" class="btn-chauffage w-24 h-24 rounded-xl border-2 flex items-center justify-center focus:outline-none bg-white border-gray-200 text-pn-navy hover:border-gray-300">
                                <span class="font-semibold text-sm">Gaz</span>
                            </button>
                            
                            <!-- Fioul -->
                            <button type="button" data-type="fioul" class="btn-chauffage w-24 h-24 rounded-xl border-2 flex items-center justify-center focus:outline-none bg-white border-gray-200 text-pn-navy hover:border-gray-300">
                                <span class="font-semibold text-sm">Fioul</span>
                            </button>
                        </div>
                    </div>

                    <!-- Input Surface -->
                    <div>
                        <label class="block text-pn-navy font-bold mb-4 text-base md:text-lg">Surface de votre logement :</label>
                        <div class="relative w-36">
                            <input type="number" id="surface-input" value="100" min="10" max="500" class="w-full border-2 border-gray-200 rounded-xl py-3 pl-4 pr-10 text-lg font-bold text-pn-navy text-center focus:outline-none focus:border-pn-blue transition-colors">
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-pn-gray font-medium">m²</span>
                        </div>
                    </div>
                </div>

                <!-- COLONNE DROITE (Plus large pour éviter les problèmes de texte) -->
                <div class="md:col-span-7 flex flex-col justify-between space-y-8">
                    
                    <!-- Facture estimée & Slider Dynamique -->
                    <div>
                        <!-- FLEX BOX AVEC NO-WRAP SUR LE PRIX -->
                        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end mb-5 gap-2">
                            <label class="text-pn-navy font-bold text-base md:text-lg leading-tight">Facture annuelle estimée :</label>
                            <!-- La classe whitespace-nowrap empêche le symbole € de passer à la ligne -->
                            <div class="text-pn-navy font-black text-3xl whitespace-nowrap">
                                <span id="bill-display">3270</span> €
                            </div>
                        </div>
                        
                        <div class="relative pt-2 pb-2">
                            <!-- Slider interactif -->
                            <input type="range" id="bill-slider" min="100" max="8000" step="50" value="3270" class="w-full">
                            
                            <div class="flex justify-between text-xs text-pn-gray font-medium mt-3">
                                <span>100€</span>
                                <span>8000€</span>
                            </div>
                        </div>
                    </div>

                    <!-- Carte de résultat épurée (Fond clair, pas de bouton) -->
                    <div class="bg-pn-light rounded-2xl p-6 md:p-8 text-center mt-auto flex flex-col justify-center border border-pn-border">
                        <h3 class="text-pn-blue font-bold uppercase tracking-widest text-xs mb-3">Économies estimées</h3>
                        <div class="text-pn-navy font-black text-4xl md:text-5xl whitespace-nowrap">
                            <span id="savings-display">0</span> <span class="text-xl md:text-2xl font-bold text-pn-navy">€</span> <span class="text-base md:text-lg font-medium text-pn-gray">/ an</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- ÉLÉMENTS DU DOM ---
            const btnsChauffage = document.querySelectorAll('.btn-chauffage');
            const billSlider = document.getElementById('bill-slider');
            const billDisplay = document.getElementById('bill-display');
            const surfaceInput = document.getElementById('surface-input');
            const savingsDisplay = document.getElementById('savings-display');

            // --- VARIABLES & CONSTANTES DE CALCUL ---
            let currentEnergy = 'electrique';
            
            // Prix des énergies (en €/kWh)
            const PRICES = {
                'electrique': 0.2516,
                'gaz': 0.115,
                'fioul': 0.135
            };
            
            const KWH_PER_M2 = 130; // Consommation moyenne pour chauffage
            const HEATING_SHARE = 0.80; // Part du chauffage dans la facture totale (80%)
            const PAC_COP = 3.5; // Rendement de la pompe à chaleur

            // --- FONCTION : Mise à jour du remplissage bleu du curseur ---
            function updateSliderBackground() {
                const min = parseInt(billSlider.min);
                const max = parseInt(billSlider.max);
                const value = parseInt(billSlider.value);
                const percentage = ((value - min) / (max - min)) * 100;
                
                // Remplissage dynamique : Bleu à gauche, Gris à droite
                billSlider.style.background = `linear-gradient(to right, #5C5EFF 0%, #5C5EFF ${percentage}%, #E5E7EB ${percentage}%, #E5E7EB 100%)`;
            }

            // --- FONCTION : Calcul des économies ---
            function calculateSavings() {
                const totalBill = parseInt(billSlider.value, 10);
                const currentPrice = PRICES[currentEnergy];
                
                // 1. Isoler la part chauffage en euros
                const heatingBill = totalBill * HEATING_SHARE;
                
                // 2. Convertir la facture chauffage en kWh selon l'énergie actuelle
                const heatingKwh = heatingBill / currentPrice;
                
                // 3. Calculer la nouvelle consommation avec la PAC (division par le COP)
                const pacKwh = heatingKwh / PAC_COP;
                
                // 4. Calculer le nouveau coût (la PAC fonctionne toujours à l'électricité)
                const pacCost = pacKwh * PRICES['electrique'];
                
                // 5. Calculer les économies (Ancien coût - Nouveau coût)
                const savings = Math.round(heatingBill - pacCost);
                
                // Affichage (si négatif ou nul, on affiche 0)
                savingsDisplay.innerText = savings > 0 ? savings : 0;
            }

            // --- ÉVÉNEMENT : Clic sur les boutons d'énergie ---
            btnsChauffage.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentEnergy = btn.getAttribute('data-type');
                    
                    // Réinitialisation de tous les boutons (état inactif)
                    btnsChauffage.forEach(b => {
                        b.classList.remove('bg-pn-blue', 'text-white', 'shadow-md');
                        b.classList.add('bg-white', 'border-gray-200', 'text-pn-navy');
                    });
                    
                    // Activation du bouton cliqué (état actif)
                    btn.classList.remove('bg-white', 'border-gray-200', 'text-pn-navy');
                    btn.classList.add('bg-pn-blue', 'text-white', 'shadow-md', 'border-pn-blue');
                    
                    // Met à jour le calcul de base avec la nouvelle énergie pour la surface donnée
                    surfaceInput.dispatchEvent(new Event('input'));
                });
            });

            // --- ÉVÉNEMENT : Modification de la surface (met à jour le curseur automatiquement) ---
            surfaceInput.addEventListener('input', () => {
                const surface = parseInt(surfaceInput.value, 10) || 0;
                
                // Calcul de la facture théorique : Surface * (130 kWh) * Prix de l'énergie
                let theoreticalBill = Math.round(surface * KWH_PER_M2 * PRICES[currentEnergy]);
                
                // On met à jour la valeur du curseur (en respectant les limites 100 et 8000)
                if (theoreticalBill > 8000) theoreticalBill = 8000;
                if (theoreticalBill < 100) theoreticalBill = 100;
                
                billSlider.value = theoreticalBill;
                billDisplay.innerText = theoreticalBill;
                
                updateSliderBackground();
                calculateSavings();
            });

            // --- ÉVÉNEMENT : Déplacement manuel du curseur de la facture ---
            billSlider.addEventListener('input', (e) => {
                billDisplay.innerText = e.target.value;
                updateSliderBackground();
                calculateSavings();
            });

            // --- INITIALISATION AU CHARGEMENT ---
            surfaceInput.dispatchEvent(new Event('input'));
        });
    </script>
</body>
</html>
